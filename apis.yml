name: Remedy Corporation
description: >-
  Remedy Corporation was an IT service management (ITSM) software company founded in 1991 by
  Lawrence Garlick, David Mahler, and Doug Mueller, and backed by Accel with a Series A investment.
  Its flagship Action Request System (AR System) became a leading help-desk and IT service
  management platform. The company went public on NASDAQ under the ticker RMDY, was acquired by
  Peregrine Systems in 2001, and its ITSM assets were subsequently acquired by BMC Software in 2002,
  where the Remedy ITSM product line continued for many years. Remedy Corporation no longer exists
  as an independent company and publishes no active developer portal, documentation, or public API.
